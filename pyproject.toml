[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "0.1.0"
description = "Security-first personal Agent OS control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "httpx>=0.27",
  "aiogram>=3.13,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "aiosqlite>=0.20",   # test-only async DB driver; PostgreSQL is the only production backend
  "ruff>=0.7",
]

[tool.setuptools]
packages = [
  "app",
  "app.adapters",
  "app.api",
  "app.core",
  "app.infra",
  "app.services",
  "app.telegram",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008 is the standard FastAPI Depends() idiom; C408 dict() calls in test
# helpers are intentional for readability.
extend-ignore = ["B008", "C408"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["I001"]
"tests/conftest.py" = ["E402"]
