x-model-env: &model-env
  MODEL_PROVIDER: ${MODEL_PROVIDER:-none}
  MODEL_NAME: ${MODEL_NAME:-}
  MODEL_BASE_URL: ${MODEL_BASE_URL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEFAULT_MODEL_PROFILE: ${DEFAULT_MODEL_PROFILE:-standard}
  MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-60}
  MAX_MODEL_CALLS_PER_TASK: ${MAX_MODEL_CALLS_PER_TASK:-2}
  CONTEXT_MAX_MESSAGES: ${CONTEXT_MAX_MESSAGES:-12}
  CONTEXT_MAX_CHARS: ${CONTEXT_MAX_CHARS:-12000}

services:
  kernel:
    build: .
    restart: unless-stopped
    environment:
      <<: *model-env
      AGENTOS_ENV: ${AGENTOS_ENV:-dev}
      AGENTOS_CONTROL_TOKEN: ${AGENTOS_CONTROL_TOKEN:?set AGENTOS_CONTROL_TOKEN in .env}
      DATABASE_URL: postgresql+asyncpg://agentos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/agentos
      REDIS_URL: redis://redis:6379/0
    # Loopback only. Never publish the API on a routable interface here.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 10

  telegram-gateway:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.telegram.runner"]
    # Long polling only: no inbound port published.
    environment:
      <<: *model-env
      AGENTOS_ENV: ${AGENTOS_ENV:-dev}
      DATABASE_URL: postgresql+asyncpg://agentos:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/agentos
      REDIS_URL: redis://redis:6379/0
      OWNER_TELEGRAM_IDS: ${OWNER_TELEGRAM_IDS:-}
      COURIER_TELEGRAM_BOT_TOKEN: ${COURIER_TELEGRAM_BOT_TOKEN:-}
      INTELLIGENCE_TELEGRAM_BOT_TOKEN: ${INTELLIGENCE_TELEGRAM_BOT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      kernel:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Not published to the host: only reachable on the internal compose network.
    environment:
      POSTGRES_DB: agentos
      POSTGRES_USER: agentos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - agentos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentos -d agentos"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Not published to the host.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - agentos_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  agentos_postgres:
  agentos_redis:
